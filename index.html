<style>
  :root {
    --ink: #212721;          /* PANTONE Black 3 C */
    --accent: #00B5E2;       /* PANTONE 306 C */
    --stone: #F7F6F3;
    --stone-2: #EDEBE6;
    --muted: #5E625D;
    --logo-ink: var(--ink);
    --logo-accent: var(--accent);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--stone);
    color: var(--ink);
    font-family: "Jost", "Futura", "Century Gothic", system-ui, sans-serif;
    font-weight: 400;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  .page {
    position: relative;
    z-index: 1;
    min-height: 100%;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: clamp(40px, 9vh, 96px) 16px 24px;
    text-align: center;
  }
  main {
    flex: 1;
    width: 100%;
    max-width: 560px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  h1 { margin: 0; line-height: 0; }
  .logo svg {
    display: block;
    width: min(380px, 78vw);
    height: auto;
  }

  .eyebrow {
    margin: clamp(40px, 7vh, 64px) 0 0;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: .32em;
    text-transform: uppercase;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .eyebrow::before, .eyebrow::after {
    content: "";
    width: 28px;
    height: 2px;
    background: var(--accent);
  }
  h2 {
    margin: 18px 0 0;
    font-size: clamp(26px, 5.2vw, 36px);
    font-weight: 300;
    line-height: 1.2;
    letter-spacing: .01em;
    text-wrap: balance;
  }
  .lede {
    margin: 16px 0 0;
    max-width: 30em;
    font-size: 18px;
    font-weight: 400;
    line-height: 1.6;
    color: var(--muted);
    text-wrap: pretty;
  }

  .contact {
    margin-top: 36px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
  }
  .phone {
    font-size: clamp(30px, 7vw, 42px);
    font-weight: 400;
    letter-spacing: .04em;
    color: var(--ink);
    text-decoration: none;
    font-variant-numeric: tabular-nums;
    border-bottom: 2px solid var(--accent);
    padding-bottom: 4px;
    transition: color .2s;
  }
  .phone:hover { color: #000; }
  .actions { display: flex; gap: 12px; flex-wrap: wrap; justify-content: center; }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    min-height: 48px;
    padding: 0 26px;
    border-radius: 2px;
    font: inherit;
    font-size: 14px;
    font-weight: 500;
    letter-spacing: .18em;
    text-transform: uppercase;
    text-decoration: none;
    border: 1.5px solid var(--ink);
    transition: background-color .2s, color .2s, border-color .2s;
  }
  .btn svg { width: 18px; height: 18px; flex: none; }
  .btn-primary { background: var(--ink); color: #fff; }
  .btn-primary:hover { background: #000; border-color: #000; }
  .btn-ghost { background: transparent; color: var(--ink); }
  .btn-ghost:hover { background: var(--ink); color: #fff; }
  .btn:focus-visible, .phone:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 4px;
  }

  footer {
    margin-top: 56px;
    font-size: 13px;
    letter-spacing: .06em;
    color: var(--muted);
  }

  /* Drifting bands at the bottom, echoing the waves in the logo mark */
  .waves {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    height: 24vh;
    min-height: 140px;
    z-index: 0;
    pointer-events: none;
    overflow: hidden;
  }
  .wave {
    position: absolute;
    left: 0; bottom: 0;
    width: 200%;
    height: 100%;
    animation: drift linear infinite;
  }
  .wave path { vector-effect: non-scaling-stroke; }
  .wave-1 { animation-duration: 48s; }
  .wave-2 { animation-duration: 34s; animation-direction: reverse; }
  .wave-3 { animation-duration: 60s; }
  @keyframes drift { to { transform: translateX(-50%); } }
  @media (prefers-reduced-motion: reduce) {
    .wave { animation: none; }
  }

  @media (max-width: 480px) {
    .lede { font-size: 17px; }
    .actions { width: 100%; }
    .btn { flex: 1; justify-content: center; padding: 0 16px; }
  }
</style>
